<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy — defensa en profundidad anti-XSS (audit
      adversarial 2026-05-30, M2). Hoy no hay sinks XSS porque React
      auto-escapa JSX, pero si un futuro commit introduce
      dangerouslySetInnerHTML o una dep comprometida inyecta script,
      CSP bloquea ejecución de scripts fuera de 'self'.

      Permitido:
      - script-src 'self' → solo el bundle de Vite (mismo origen).
      - style-src 'self' 'unsafe-inline' fonts.googleapis.com → React
        inline styles + fonts CSS.
      - font-src fonts.gstatic.com → archivos .woff2.
      - img-src 'self' data: https://flagcdn.com → flags de país.
      - connect-src 'self' https://*.supabase.co wss://*.supabase.co →
        REST + realtime de Supabase.
      - frame-ancestors 'none' → anti clickjacking.

      Para self-hostear flagcdn.com y fonts (eliminar deps externos sin SRI):
      ver L3 del audit. Mientras tanto, allowlist explícita.

      Fase 0 (workflow local): el placeholder VITE_CSP_EXTRA_CONNECT_SRC
      (ver más abajo en connect-src) agrega el Supabase LOCAL — reemplazo
      de Vite vía HTML env replacement, solo seteado en .env.local
      (gitignoreado, nunca en .env.production.local ni en el build real).
      Si esa var no está seteada, el placeholder se reemplaza por string
      vacío y el CSP de producción queda exactamente igual de estricto
      que siempre.
    -->
    <!--
      NOTA: frame-ancestors NO se incluye porque el browser lo ignora
      cuando viene via <meta> (debe ser HTTP header). GitHub Pages no
      permite headers custom, así que esa protección anti-clickjacking
      queda fuera. Si en el futuro migramos a un host con headers custom,
      agregar X-Frame-Options: DENY o frame-ancestors 'none' allí.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://flagcdn.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co %VITE_CSP_EXTRA_CONNECT_SRC%;
      base-uri 'self';
      form-action 'self';
    " />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing CI Dashboard — Yango Peru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
